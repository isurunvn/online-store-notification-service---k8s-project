spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

spring.mail.host=${SMTP_HOST:mailhog}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}

notification.email.from=${NOTIFICATION_EMAIL_FROM:no-reply@onlinestore.com}
notification.email.enabled=${NOTIFICATION_EMAIL_ENABLED:false}

logging.level.com.onlinestore.notificationservice=INFO
logging.level.root=INFO
