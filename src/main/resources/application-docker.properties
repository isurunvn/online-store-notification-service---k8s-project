spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:your-gmail@gmail.com}
spring.mail.password=${SMTP_PASSWORD:your-gmail-app-password}

notification.email.from=${NOTIFICATION_EMAIL_FROM:your-gmail@gmail.com}
notification.email.enabled=${NOTIFICATION_EMAIL_ENABLED:false}

logging.level.com.onlinestore.notificationservice=INFO
logging.level.root=INFO
