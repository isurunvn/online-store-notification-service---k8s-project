# Development profile
# Required env vars:
# RABBITMQ_HOST=localhost
# RABBITMQ_PORT=5672
# RABBITMQ_USERNAME=guest
# RABBITMQ_PASSWORD=guest
# SMTP_HOST=smtp.mailtrap.io (or mailhog: localhost)
# SMTP_PORT=587
# SMTP_USERNAME=your_mailtrap_user
# SMTP_PASSWORD=your_mailtrap_pass
# NOTIFICATION_EMAIL_ENABLED=false (disable actual email sending in dev)

logging.level.com.onlinestore.notificationservice=DEBUG
logging.level.org.springframework.amqp=DEBUG
logging.level.org.springframework.mail=DEBUG

notification.email.enabled=false
